[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "mealplanbot"
version = "0.1.0"
description = "Local Raspberry Pi meal planner and Telegram shopping assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "python-telegram-bot[job-queue]>=22.5,<23",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<0.29", "ruff>=0.9,<1"]

[project.scripts]
mealplan = "mealplan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
