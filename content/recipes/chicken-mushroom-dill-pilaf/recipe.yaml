sections:
  - id: "method"
    title: "Method"
    steps:
      - id: "step-1"
        content:
          - text: "0:00–0:15 — Prep. Rinse rice until water is mostly clear. Cut chicken into even bite-size pieces; cut onion and carrots into a "
          - term: "medium-dice"
            label: "medium dice"
          - text: " (½-inch, about 1.2 cm cubes); slice mushrooms. Mince garlic (chop very finely) and dice tomatoes."
      - id: "step-2"
        content:
          - text: "0:15–0:28 — Infuse and brown. Heat oil in a wide Dutch oven. Add the whole cloves and star-anise point for about 30 seconds to infuse the oil (release their aroma into the fat). Lift them out and reserve. Brown salted chicken in two batches; remove. "
          - term: "saute"
            label: "Sauté"
          - text: " (cook in a little oil while stirring) onion, carrot and mushrooms until the mushroom water has largely evaporated."
      - id: "step-3"
        content:
          - text: "0:28–0:35 — "
          - term: "toast-grains"
            label: "Toast"
          - text: ". Add garlic, paprika, cumin and ground hot pepper; "
          - term: "bloom"
            label: "bloom"
          - text: " the ground spices (heat briefly in oil to release aroma) for 30 seconds. Stir in tomatoes and toast the rice (coat and heat the grains) for 2 minutes. Return chicken, its juices and the reserved whole spices."
      - id: "step-4"
        content:
          - text: "0:35–0:53 — Steam. Add measured hot liquid and salt. Bring to a boil, cover tightly, lower heat and cook 15–18 minutes, until rice is tender and chicken reaches 74°C. Turn off heat and rest covered 5 minutes. Do not repeatedly lift the lid."
      - id: "step-5"
        content:
          - text: "Finish. Find and remove the two cloves and star-anise point. "
          - label: "Fluff"
            explanation: "Separate the cooked grains gently with a fork rather than compressing them."
          - text: " with dill and black pepper. If your rice package specifies a different liquid ratio, use that ratio, accounting for the small amount of tomato juice."
