sections:
  -
    id: "method"
    title: "Method"
    steps:
      -
        id: "step-1"
        content:
          -
            text: "0:00–0:05 — Start buckwheat. Rinse and cook in salted water according to the package, generally 15–20 minutes; keep covered afterward."
      -
        id: "step-2"
        content:
          -
            text: "0:05–0:18 — Prep. Cut onion into a "
          -
            term: "small-dice"
            label: "small dice"
          -
            text: " (¼-inch, about 6 mm cubes), finely shred the cabbage into thin ribbons, and coarsely grate the peeled beets on a box grater. Use a separate board for raw turkey."
      -
        id: "step-3"
        content:
          -
            text: "0:18–0:28 — Brown turkey. Heat a large skillet with oil. Sauté (cook in a little hot oil while stirring) the turkey with onion, breaking it apart; season with salt, paprika and coriander. Cook until no pink remains and the turkey reaches 74°C."
      -
        id: "step-4"
        content:
          -
            text: "0:28–0:43 — Cook vegetables. Add garlic, beets and cabbage plus 100 ml water. Cover for 7–9 minutes, then uncover and "
          -
            term: "reduce"
            label: "reduce"
          -
            text: " (evaporate) the excess moisture. The beets should be tender with a little bite."
      -
        id: "step-5"
        content:
          -
            text: "Finish. Stir in dill and lemon juice. Serve over buckwheat with yogurt mixed with lemon zest and a pinch of salt, if using."
