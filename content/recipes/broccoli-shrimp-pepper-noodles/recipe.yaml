sections:
  - id: "method"
    title: "Method"
    steps:
      - id: "step-1"
        content:
          - text: "0:00–0:12 — Boil and prep. Put noodle water on high heat. Cut broccoli into small florets and julienne the peeled stems (thin matchsticks); thinly slice peppers and green onions. Pat shrimp dry. Whisk soy sauce, vinegar, honey, starch and water."
      - id: "step-2"
        content:
          - text: "0:12–0:22 — Cook noodles and vegetables. Cook noodles per package; drain. Stir-fry (cook quickly while moving the food in a hot pan) broccoli and peppers with a splash of water; cover 3 minutes, uncover and cook until bright and crisp-tender. Add garlic, ginger if using, and white green-onion parts."
      - id: "step-3"
        content:
          - text: "0:22–0:29 — Cook shrimp. Push vegetables aside or work in batches. Cook shrimp until opaque and firm, generally 2–3 minutes per side depending on size; reach 74°C. Avoid prolonged cooking."
      - id: "step-4"
        content:
          - text: "0:29–0:35 — Sauce. Re-stir the starch mixture, pour it into the pan and "
          - term: "simmer"
            label: "simmer"
          - text: " until it thickens enough to lightly coat the vegetables. Toss with noodles, sesame oil and green onion tops."
