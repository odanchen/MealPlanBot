sections:
  - id: "method"
    title: "Method"
    steps:
      - id: "step-1"
        content:
          - recipe: "simple-rice"
            label: "0:00 — Start rice. Rinse rice and put it on with measured water and salt. Bring to a boil, cover, lower heat and cook per package; rest covered 10 minutes."
            section: "method"
      - id: "step-2"
        content:
          - text: "0:05–0:18 — Cut and "
          - term: "sweat"
            label: "sweat"
          - text: ". Cut onion and carrots into a "
          - term: "small-dice"
            label: "small dice"
          - text: " (¼-inch, about 6 mm cubes). Cut potatoes into larger, roughly 1.5 cm cubes; cut chicken separately. Finely grate the ginger so it disperses and softens quickly. Sweat the onion and carrot (cook gently in oil without browning) for 5 minutes. Add garlic, ginger, curry powder, cumin, cloves, bay leaves, cinnamon and ground hot pepper; "
          - term: "bloom"
            label: "bloom"
          - text: " the spices (stir them briefly in hot oil to release their aroma) for 1 minute."
      - id: "step-3"
        content:
          - text: "0:18–0:35 — "
          - term: "simmer"
            label: "Simmer"
          - text: ". Stir in potatoes, coconut milk and water. Cover and "
          - term: "simmer"
            label: "simmer"
          - text: " 12–15 minutes, until potatoes are almost tender."
      - id: "step-4"
        content:
          - text: "0:35–0:48 — Add chicken and beans. Add chicken and drained cooked chickpeas. "
          - term: "simmer"
            label: "Simmer"
          - text: " 10–12 minutes, stirring, until chicken reaches 74°C and potato is tender. If using thigh chunks, allow a few more minutes."
      - id: "step-5"
        content:
          - text: "Finish. Remove the bay leaves and visible cloves. Balance (adjust) with salt and lemon or lime, then spoon over rice."
