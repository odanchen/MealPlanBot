schemaVersion: 1
id: "chicken-chickpea-potato-coconut-curry-with-rice"
title: "Chicken Chickpea and Potato Coconut Curry with Rice"
servings:
  estimate: 5
  note: "5–6 servings"
timing:
  guidance: "50–55 minutes"
preparationGuidance: "Before you start: Soak and fully cook the listed 200 g dry chickpeas according to their package directions. Use the entire drained batch in this recipe; cooked yield varies. The meal time below excludes soaking and bean cooking. If preparing them ahead, cool promptly and refrigerate until needed.\n\nUse chicken breast or boneless thigh, cut into bite-size pieces. Cook the dry chickpeas ahead as described below. Add 250–350 ml water to the curry; measure rice cooking water according to its package. Cilantro is an optional extra, not included in the shopping list."
