schemaVersion: 1
id: "beef-black-bean-chipotle-chili"
title: "Beef Black Bean and Chipotle Chili"
servings:
  estimate: 5
  note: "5–6 servings"
timing:
  guidance: "50–55 minutes"
preparationGuidance: "Before you start: Soak and fully cook the listed 200 g dry black beans according to their package directions. Use the entire drained batch in this recipe; cooked yield varies. The meal time below excludes soaking and bean cooking. If preparing them ahead, cool promptly and refrigerate until needed.\n\nCook the dry black beans ahead as described below. Blend or finely chop the tomatoes. Soften and mince the chipotles. Rice is optional but included in the shopping list; use cooking water according to its package. Add chili flakes and salt to taste."
