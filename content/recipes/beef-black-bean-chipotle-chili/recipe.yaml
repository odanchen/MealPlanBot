sections:
  -
    id: "method"
    title: "Method"
    steps:
      -
        id: "step-1"
        content:
          -
            text: "0:00 — Start optional rice. Rinse and cook according to package. Put both chipotles in hot water to soften."
      -
        id: "step-2"
        content:
          -
            text: "0:05–0:18 — Chop and brown. Cut onion, carrot and peppers into a "
          -
            term: "small-dice"
            label: "small dice"
          -
            text: " (¼-inch, about 6 mm cubes). Brown beef in a Dutch oven, breaking it up. Drain excess fat if necessary."
      -
        id: "step-3"
        content:
          -
            text: "0:18–0:30 — Build flavour. Add onion and carrot for 6 minutes, then bell peppers and garlic for 4 minutes. Stir in minced chipotles, tomato paste, chili flakes and spices for 1 minute to "
          -
            term: "bloom"
            label: "bloom"
          -
            text: " the spices (release their aroma in the hot fat)."
      -
        id: "step-4"
        content:
          -
            text: "0:30–0:50 — "
          -
            term: "simmer"
            label: "Simmer"
          -
            text: ". Add blended fresh tomatoes and cooked black beans. "
          -
            term: "reduce"
            label: "Reduce"
          -
            text: " ("
          -
            term: "simmer"
            label: "simmer"
          -
            text: " uncovered to evaporate liquid), stirring occasionally, until thick enough to mound on a spoon. Add a splash of water only if it threatens to stick. Ground beef should reach 71°C."
      -
        id: "step-5"
        content:
          -
            text: "Finish. Salt and add lime to taste. Serve as a thick chili or over rice."
