sections:
  -
    id: "method"
    title: "Method"
    steps:
      -
        id: "step-1"
        content:
          -
            text: "0:00–0:10 — Start grain and sauce. Cook bulgur in salted water as directed. Stir yogurt with lemon juice, grated garlic, half the chopped dill and salt; refrigerate."
      -
        id: "step-2"
        content:
          -
            text: "0:10–0:22 — Prep. Cut chicken into an émincé (even, thin strips); season with oregano, salt, pepper, oil and lemon zest. Dice the cucumber, tomatoes and pepper (cut into small, even cubes); toss with greens, remaining dill and a little olive oil."
      -
        id: "step-3"
        content:
          -
            text: "0:22–0:35 — Sear. Sear means brown rapidly in a hot pan. Heat a wide skillet and cook chicken in batches, turning, until browned and 74°C. Rest 3 minutes."
      -
        id: "step-4"
        content:
          -
            text: "0:35–0:45 — Finish. Fluff the bulgur with a fork. Serve with chicken, cool vegetables and dill yogurt sauce."
