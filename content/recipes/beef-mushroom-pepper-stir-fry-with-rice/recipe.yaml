sections:
  -
    id: "method"
    title: "Method"
    steps:
      -
        id: "step-1"
        content:
          -
            recipe: "simple-rice"
            label: "0:00 — Start rice according to package directions."
            section: "method"
      -
        id: "step-2"
        content:
          -
            text: "0:05–0:18 — Slice and mix. Cut the beef into an émincé (thin slices), across the grain so the muscle fibres are short. For a light protective coating, if desired, toss the beef with egg white and a little of the measured soy sauce and cornstarch before its brief "
          -
            term: "sear"
            label: "sear"
          -
            text: ". Slice onions, mushrooms and peppers. Mix remaining soy sauce, starch, vinegar, sugar and water in a cup."
      -
        id: "step-3"
        content:
          -
            text: "0:18–0:34 — Stir-fry and sear. Sear means brown rapidly over high heat. Heat cast iron or stainless pan until hot. Sear beef in 2–3 batches, 2–3 minutes per batch; transfer out. Cook onions, mushrooms and peppers in batches so they brown rather than steam."
      -
        id: "step-4"
        content:
          -
            text: "0:34–0:43 — Combine. Add garlic for 30 seconds. Return beef and juices, pour in the re-stirred sauce, and toss until the thickened sauce lightly coats the beef and vegetables. Check the beef with a food thermometer: at least 63°C for whole-cut beef, or longer for your preferred doneness. If using mechanically tenderized beef, follow the package’s cooking directions. Cook the optional egg-white coating through."
      -
        id: "step-5"
        content:
          -
            text: "Finish. Serve over rice, adding green onions if wanted."
