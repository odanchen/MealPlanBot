sections:
  -
    id: "method"
    title: "Method"
    steps:
      -
        id: "step-1"
        content:
          -
            text: "0:00–0:12 — Start bulgur and dice. Cook bulgur according to package. Weigh the raw peeled, deseeded squash and cut it into even 1–1.5 cm cubes so it cooks quickly; dice onion and mince garlic (chop very finely). A helper may cube squash earlier that day and refrigerate it."
      -
        id: "step-2"
        content:
          -
            text: "0:12–0:25 — Brown turkey. In a deep skillet or Dutch oven, cook turkey and onion in oil, breaking up meat. Add garlic and "
          -
            term: "bloom"
            label: "bloom"
          -
            text: " the spices (briefly heat them in the pan to release aroma) for the final minute. Turkey should reach 74°C."
      -
        id: "step-3"
        content:
          -
            text: "0:25–0:45 — Cook squash. Add squash, 150 ml water and a pinch of salt. Cover and "
          -
            term: "simmer"
            label: "simmer"
          -
            text: " 10–12 minutes, then uncover and "
          -
            term: "reduce"
            label: "reduce"
          -
            text: " (evaporate) the liquid for about 5 minutes. Test a cube with a fork; add a few minutes if needed."
      -
        id: "step-4"
        content:
          -
            text: "0:45–0:55 — Finish. Fold in spinach until wilted, lemon zest and juice. Spoon over bulgur and scatter pumpkin seeds if using."
