sections:
  - id: "method"
    title: "Method"
    steps:
      - id: "step-1"
        content:
          - text: "0:00–0:15 — Chop and brown. Cut onion and carrot into a "
          - term: "small-dice"
            label: "small dice"
          - text: " (¼-inch, about 6 mm cubes), slice mushrooms, then cut chicken separately into even pieces. Brown salted chicken in a Dutch oven in two batches; transfer out."
      - id: "step-2"
        content:
          - text: "0:15–0:27 — Build base. "
          - term: "sweat"
            label: "Sweat"
          - text: " the onion and carrots (cook gently without browning) for 5 minutes, then "
          - term: "saute"
            label: "sauté"
          - text: " mushrooms until their water mostly evaporates. Add garlic, tomato paste and herbs for 1 minute."
      - id: "step-3"
        content:
          - text: "0:27–0:42 — "
          - term: "simmer"
            label: "Simmer"
          - text: ". Dissolve the chicken bouillon cube in the water, then add it with the cooked, drained white beans and chicken. "
          - term: "simmer"
            label: "Simmer"
          - text: " 10–12 minutes until carrot is tender and chicken reaches 74°C. Crush a few beans against the pot to thicken; "
          - term: "reduce"
            label: "reduce"
          - text: " ("
          - term: "simmer"
            label: "simmer"
          - text: " uncovered to evaporate liquid) if necessary. This should be spoonable, not soupy."
      - id: "step-4"
        content:
          - text: "0:38–0:45 — Couscous in parallel. Pour measured boiling water over salted couscous, cover 5 minutes and "
          - term: "fluff"
            label: "fluff"
          - text: "."
      - id: "step-5"
        content:
          - text: "Finish. Add parsley and lemon. Spoon the thick stew over couscous."
