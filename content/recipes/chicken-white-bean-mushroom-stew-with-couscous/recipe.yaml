schemaVersion: 1
id: "chicken-white-bean-mushroom-stew-with-couscous"
title: "Chicken White Bean and Mushroom Stew with Couscous"
servings:
  estimate: 5
  note: "5–6 servings"
timing:
  guidance: "45–50 minutes"
preparationGuidance: "Before you start: Soak and fully cook the listed 200 g dry white beans according to their package directions. Use the entire drained batch in this recipe; cooked yield varies. The meal time below excludes soaking and bean cooking. If preparing them ahead, cool promptly and refrigerate until needed.\n\nUse chicken breast or boneless thigh, cut into bite-size pieces. Cook the dry white beans ahead as described below. Use 500 ml water with the bouillon cube, plus couscous cooking water according to its package. Add salt and pepper to taste."
